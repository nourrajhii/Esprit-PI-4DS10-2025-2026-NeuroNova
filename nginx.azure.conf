# EstateMind — Nginx reverse proxy for Azure VM
# All traffic enters on port 80, routed to internal Docker services

# ── Increase timeouts for AI agent responses ──────────────────────────────────
proxy_read_timeout    300s;
proxy_connect_timeout 10s;
proxy_send_timeout    300s;

# ── Frontend (Next.js) ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Large uploads (3D images)
    client_max_body_size 50M;

    # Frontend — default route
    location / {
        proxy_pass         http://immo-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (Node.js auth, listings, stripe)
    location /api/ {
        proxy_pass         http://immo-backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # VIAGRA AI orchestrator
    location /viagra/ {
        proxy_pass         http://immo-viagra:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Health checks for each agent (useful for monitoring)
    location /health/backend   { proxy_pass http://immo-backend:4000/health; }
    location /health/viagra    { proxy_pass http://immo-viagra:8000/health; }
    location /health/legal     { proxy_pass http://immo-nour2-legal:8003/health; }
    location /health/devis     { proxy_pass http://immo-nour-devis:8002/health; }
    location /health/forecast  { proxy_pass http://immo-forecast:8004/health; }
    location /health/price     { proxy_pass http://immo-price-predictor:8005/health; }
}

# ── Direct port access (keep open in NSG for development/testing) ─────────────
# Port 4000  → backend  (Node.js)
# Port 8000  → viagra   (AI orchestrator)
# Port 3001  → frontend (Next.js — alternative to port 80)
