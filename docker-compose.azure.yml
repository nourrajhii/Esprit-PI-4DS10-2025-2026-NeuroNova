version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  EstateMind — Azure Cloud Deployment
#  Usage:  docker-compose -f docker-compose.azure.yml up -d
#
#  Differences from local:
#    - NO Ollama  (legal agent uses Gemini API only)
#    - NO Villa3D SD model  (Tripo API still works, SD skipped)
#    - Nginx reverse proxy on port 80
#    - All NEXT_PUBLIC_ URLs point to VM public IP  (set SERVER_HOST in .env)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  immo-net:
    driver: bridge

volumes:
  redis-data:
  chroma-data:
  mysql-data:

# ─── Shared env anchors ───────────────────────────────────────────────────────
x-gemini-env: &gemini-env
  GEMINI_API_KEY: ${GEMINI_API_KEY}

x-mongo-env: &mongo-env
  MONGODB_URI: ${MONGODB_URI}
  SCRAPED_DB_URI: ${SCRAPED_DB_URI:-${MONGODB_URI}}
  DATABASE_URL: ${MONGODB_URI}

x-redis-env: &redis-env
  REDIS_URL: redis://redis:6379

services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: immo-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: immo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-real_estate_advisor_db}
      MYSQL_USER: ${MYSQL_USER:-advisor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-advisorpass}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Node.js Backend ───────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: immo-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      <<: *mongo-env
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: http://${SERVER_HOST}:3001
      BACKEND_PUBLIC_URL: http://${SERVER_HOST}:4000
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_APP_NAME: ${SMTP_APP_NAME:-EstateMind}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── AI Agents ─────────────────────────────────────────────────────────────────

  dhia:
    build:
      context: ./dhia
      dockerfile: Dockerfile
    container_name: immo-dhia
    restart: unless-stopped
    environment:
      <<: [*mongo-env, *gemini-env]
      SERPAPI_KEY: ${SERPAPI_KEY}
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8055/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  real-estate-advisor-backend:
    build:
      context: ./real_estate_advisor_backend
      dockerfile: Dockerfile
    container_name: immo-advisor-backend
    restart: unless-stopped
    environment:
      <<: *mongo-env
      # No Ollama in cloud — agent uses its own fallback
      OLLAMA_BASE_URL: ""
      OLLAMA_HOST: ""
    depends_on:
      - mysql
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nour:
    build:
      context: ./nour/Esprit-PI-4DS10-2025-2026-NeuroNova-Agent_Devis
      dockerfile: Dockerfile
    container_name: immo-nour-devis
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ""
      OLLAMA_HOST: ""
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nour2:
    build:
      context: ./nour2/Esprit-PI-4DS10-2025-2026-NeuroNova-AgentLegal
      dockerfile: Dockerfile
    container_name: immo-nour2-legal
    restart: unless-stopped
    environment:
      <<: *gemini-env
      OLLAMA_BASE_URL: ""
      OLLAMA_HOST: ""
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  immo-forecast:
    build:
      context: ./services/immo-forecast
      dockerfile: Dockerfile
    container_name: immo-forecast
    restart: unless-stopped
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  price-predictor:
    build:
      context: ./services/price-predictor
      dockerfile: Dockerfile
    container_name: immo-price-predictor
    restart: unless-stopped
    environment:
      DHIA_URL: http://dhia:8055
    depends_on:
      - dhia
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  investment-scorer:
    build:
      context: ./services/investment-scorer
      dockerfile: Dockerfile
    container_name: immo-investment-scorer
    restart: unless-stopped
    environment:
      <<: *gemini-env
      DHIA_URL: http://dhia:8055
    depends_on:
      - dhia
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  geo-advisor:
    build:
      context: ./services/geo-advisor
      dockerfile: Dockerfile
    container_name: immo-geo-advisor
    restart: unless-stopped
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  lifestyle-match:
    build:
      context: ./services/lifestyle-match
      dockerfile: Dockerfile
    container_name: immo-lifestyle-match
    restart: unless-stopped
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── VIAGRA Orchestrator ───────────────────────────────────────────────────────

  viagra:
    build:
      context: ./viagra
      dockerfile: Dockerfile
    container_name: immo-viagra
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: [*redis-env, *mongo-env, *gemini-env]
      RECOMMENDER_URL:  http://real-estate-advisor-backend:8001
      DEVIS_URL:        http://nour:8002
      LEGAL_URL:        http://nour2:8003
      FORECAST_URL:     http://immo-forecast:8004
      PRICE_URL:        http://price-predictor:8005
      INVESTMENT_URL:   http://investment-scorer:8006
      GEO_URL:          http://geo-advisor:8007
      LIFESTYLE_URL:    http://lifestyle-match:8010
      DHIA_URL:         http://dhia:8055
    depends_on:
      - redis
      - dhia
      - real-estate-advisor-backend
      - nour
      - nour2
      - immo-forecast
      - price-predictor
      - investment-scorer
      - geo-advisor
      - lifestyle-match
    networks:
      - immo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  # ── Frontend ──────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Use explicit IP/domain — ${SERVER_HOST} from .env
        NEXT_PUBLIC_VIAGRA_URL:      ${NEXT_PUBLIC_VIAGRA_URL}
        NEXT_PUBLIC_BACKEND_URL:     ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_VILLA3D_API_URL: ${NEXT_PUBLIC_VILLA3D_API_URL}
    container_name: immo-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      # MongoDB env vars needed by Next.js API routes at runtime
      MONGODB_URI: ${MONGODB_URI}
      SCRAPED_DB_URI: ${SCRAPED_DB_URI}
      DATABASE_URL: ${MONGODB_URI}
      # Also pass PUBLIC vars at runtime for SSR
      NEXT_PUBLIC_VIAGRA_URL: ${NEXT_PUBLIC_VIAGRA_URL}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    depends_on:
      - viagra
      - backend
    networks:
      - immo-net

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  # Routes everything through port 80:
  #   /         → frontend  :3000
  #   /api/     → backend   :4000
  #   /viagra/  → viagra    :8000
  #   /agents/  → individual agents

  nginx:
    image: nginx:alpine
    container_name: immo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.azure.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - viagra
    networks:
      - immo-net
